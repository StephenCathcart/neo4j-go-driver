name: DRIVERS-575 windows

on:
  workflow_dispatch:
  push:
    branches: [ci/DRIVERS-575-windows]

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Platform
        run: |
          go version
          go env GOOS GOARCH
          go list -f '{{.GoFiles}} {{.TestGoFiles}}' ./neo4j/internal/bolt/ | Select-String liveness

      - name: Liveness unit tests
        run: go test -count=1 -v -run 'PeerAlive|IsPeerAlive' ./neo4j/internal/bolt/

      - name: Liveness unit tests, 50 runs
        run: go test -count=50 -run 'PeerAlive|IsPeerAlive' ./neo4j/internal/bolt/

      - name: Liveness tests fail when the Windows peek is broken
        shell: bash
        run: |
          f=neo4j/internal/bolt/liveness_windows.go
          test "$(grep -c 'return int(n), err$' $f)" = 1
          sed -i 's/return int(n), err$/_ = err; return 0, errNothingWaiting/' $f
          git diff --stat
          go test -count=1 -run 'PeerAlive|IsPeerAlive' ./neo4j/internal/bolt/ > mutated.txt 2>&1 || true
          git checkout -- $f
          tail -5 mutated.txt
          ! grep -q "build failed" mutated.txt
          echo "subtests failing with the peek broken: $(grep -c -- '--- FAIL' mutated.txt)"
          grep -- '--- FAIL' mutated.txt
          test "$(grep -c -- '--- FAIL' mutated.txt)" -gt 0

      - name: 6.x worktree
        shell: bash
        run: |
          git fetch -q https://github.com/neo4j/neo4j-go-driver.git ef40a44232d4b4a3bfa1e7d1ab25f9a103561dc1
          git worktree add -q ../six-x ef40a44232d4b4a3bfa1e7d1ab25f9a103561dc1
          cp neo4j/test-integration/closed_by_server_test.go ../six-x/neo4j/test-integration/
          test ! -e ../six-x/neo4j/internal/bolt/liveness.go

      - name: Bolt and pool packages, PR and 6.x
        shell: bash
        run: |
          fails() { grep -E -- "--- FAIL: " | sed -E 's/^ *--- FAIL: ([^ ]+).*/\1/' | sort -u; }
          go test -count=3 -v ./neo4j/internal/bolt/ ./neo4j/internal/pool/ > pr.txt 2>&1 || true
          (cd ../six-x && go test -count=3 -v ./neo4j/internal/bolt/ ./neo4j/internal/pool/ > ../six-x.txt 2>&1 || true)
          fails < pr.txt > pr-fails.txt
          fails < ../six-x.txt > six-fails.txt
          echo "PR package results:"; grep -E "^(ok|FAIL)\s" pr.txt
          echo "6.x package results:"; grep -E "^(ok|FAIL)\s" ../six-x.txt
          echo "failing on PR: $(wc -l < pr-fails.txt), failing on 6.x: $(wc -l < six-fails.txt)"
          echo "failing on PR only:"; comm -23 pr-fails.txt six-fails.txt
          echo "failing on 6.x only:"; comm -13 pr-fails.txt six-fails.txt
          echo "failing on both:"; comm -12 pr-fails.txt six-fails.txt

      - name: Cost of the check on an open connection
        shell: bash
        run: |
          cat > neo4j/internal/bolt/zz_bench_test.go <<'EOF'
          package bolt

          import "testing"

          func BenchmarkPeerAliveOpenTCP(b *testing.B) {
          	client, _ := tcpPair(&testing.T{})
          	c := socket(client)
          	b.ResetTimer()
          	for i := 0; i < b.N; i++ {
          		if !c.peerAlive() {
          			b.Fatal("reported closed")
          		}
          	}
          }

          func BenchmarkPeerAliveOpenTLS(b *testing.B) {
          	client, _ := tlsPair(&testing.T{})
          	c := socket(client)
          	b.ResetTimer()
          	for i := 0; i < b.N; i++ {
          		if !c.peerAlive() {
          			b.Fatal("reported closed")
          		}
          	}
          }
          EOF
          go test -run XXX -bench PeerAliveOpen -benchtime 20000x -count 3 ./neo4j/internal/bolt/
          rm neo4j/internal/bolt/zz_bench_test.go

      - name: Neo4j, driver check and integration tests (one step, so the server stays up)
        shell: bash
        run: |
          set -u
          curl -sSL -o neo4j.zip https://dist.neo4j.org/neo4j-community-2025.04.0-windows.zip
          pwsh -NoProfile -Command "Expand-Archive neo4j.zip -DestinationPath '$RUNNER_TEMP'"
          N="$RUNNER_TEMP/neo4j-community-2025.04.0"
          "$N/bin/neo4j-admin.bat" dbms set-initial-password password
          "$N/bin/neo4j.bat" console > "$RUNNER_TEMP/neo4j.out" 2>&1 &
          for i in $(seq 1 60); do
            "$N/bin/cypher-shell.bat" -a neo4j://localhost:7687 -u neo4j -p password "RETURN 1" > /dev/null 2>&1 && { echo "neo4j answers queries"; break; }
            sleep 2
          done
          "$N/bin/cypher-shell.bat" -a neo4j://localhost:7687 -u neo4j -p password "CALL dbms.components() YIELD versions RETURN versions"

          mkdir -p zzcheck
          cat > zzcheck/main.go <<'EOF2'
          package main

          import (
          	"context"
          	"fmt"
          	"os"

          	"github.com/neo4j/neo4j-go-driver/v6/neo4j"
          )

          func main() {
          	ctx := context.Background()
          	for _, uri := range []string{"neo4j://localhost:7687", "bolt://localhost:7687", "neo4j://127.0.0.1:7687"} {
          		d, err := neo4j.NewDriver(uri, neo4j.BasicAuth("neo4j", "password", ""))
          		if err != nil {
          			fmt.Println(uri, "driver:", err)
          			os.Exit(1)
          		}
          		for i := 0; i < 3; i++ {
          			r, err := neo4j.ExecuteQuery(ctx, d, "CALL dbms.components() YIELD versions RETURN versions[0] AS v", nil, neo4j.EagerResultTransformer)
          			if err != nil {
          				fmt.Println(uri, "query", i, "error:", err)
          				continue
          			}
          			v, _ := r.Records[0].Get("v")
          			fmt.Println(uri, "query", i, "ok:", v)
          		}
          		_ = d.Close(ctx)
          	}
          }
          EOF2
          echo "== driver check, PR"; go run ./zzcheck
          cp -r zzcheck ../six-x/
          echo "== driver check, 6.x"; (cd ../six-x && go run ./zzcheck)
          rm -rf zzcheck ../six-x/zzcheck

          echo "== integration test, PR"
          go test -count=3 -v -run TestConnectionClosedByServer ./neo4j/test-integration/ | tee it-pr.txt
          pr_ok=$(grep -c -- "--- PASS: TestConnectionClosedByServer " it-pr.txt || true)

          echo "== integration test, 6.x"
          (cd ../six-x && go test -count=1 -v -run TestConnectionClosedByServer ./neo4j/test-integration/) | tee it-6x.txt || true
          six_fail=$(grep -c -- "--- FAIL: TestConnectionClosedByServer " it-6x.txt || true)

          echo "PR passes: $pr_ok of 3, 6.x fails: $six_fail of 1"
          echo "== neo4j log"; tail -15 "$RUNNER_TEMP/neo4j.out"
          test "$pr_ok" = 3 && test "$six_fail" = 1
